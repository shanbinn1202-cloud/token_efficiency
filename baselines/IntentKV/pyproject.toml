[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intentkv"
authors = [
    {name = "Liang Zhao", email = "lzhao@ir.hit.edu.cn"},
]
version = "0.1"
description = "IntentKV"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "torch", "transformers>=4.46.0", "accelerate", "sentencepiece", "protobuf", "flash-attn"
]

[project.urls]
"Homepage" = "https://scholar.google.com/citations?user=-CZ9GZ4AAAAJ&hl=en"

[tool.setuptools.packages.find]
exclude = ["assets*", "evaluation*", "scripts*", "observations"]