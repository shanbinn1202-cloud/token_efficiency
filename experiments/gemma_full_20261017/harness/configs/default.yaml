# The only shared experiment defaults. CLI --set uses these same keys.
model:
  name: Qwen/Qwen3.6-27B
  path: Qwen/Qwen3.6-27B
  dtype: bfloat16
  local_files_only: true
  enable_thinking: true
generation:
  max_tokens: 4096  # Per-response output limit, including thinking.
  max_turns: 120
  max_window_size: 131072
  temperature: 0.0
  top_p: 1.0
  top_k: -1  # -1 disables top-k; translated to 0 for Transformers.
  repetition_penalty: 1.0
  seed: 42
  request_timeout: 1200
  max_consecutive_format_errors: 2
dataset:
  name: princeton-nlp/SWE-bench_Verified
  split: test
  start: 0
  count: 20
evaluation:
  workers: 8  # Shared default; current in-process Transformers requires an explicit override to 1.
  grading_workers: 4
  timeout: 1800
  apptainer: apptainer
  image_manifest: data/apptainer/native/manifest.json
  output_root: results
backend:
  name: transformers
  endpoint: http://localhost:8000/v1
  api_key: EMPTY
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.90
  kv_cache_memory_bytes: 26843545600  # Default vLLM pool: 25 GiB per GPU, independent of token budget.
  prefix_caching: true
  async_scheduling: true
  cuda_graph: true
  torch_compile: true
  full_attention: sdpa
  sdpa_kernel: auto
  linear_attention: native  # Transformers' own dispatch, as in the DRAM reference.
  prefill_chunk_size: null  # Whole current suffix, as in the DRAM reference.
  vllm_attention_backend: TRITON_ATTN
  gdn_prefill_backend: triton
  max_num_batched_tokens: 4096
cache:
  kv_budget: 16384  # Default 16K; sliding caps input, AgentKV targets decode compaction.
methods:
  random_attention:
    options:
      window_size: 64
      random_seed: 42
  intentkv:
    options:
      init_q_window: 64  # Original efficiency and RULER evaluation defaults.
      block_size: 16
  repairkv:
    options:
      repair_tokens: 96
      sink_size: 4
      recency_window: 128
      pooling: max
      burst_left: 2
      burst_right: 20
  agentdiet:
    variant: agentdiet
    options:
      delay_steps: 2
      window_before_steps: 1
      token_threshold: 500
      reflection_enable_thinking: false  # CoACT Qwen reflector behavior; agent thinking stays true.
  vanilla:
    variant: full
    options: {}
  sliding_window:
    variant: sliding_window
    options: {}  # Fixed prefix + newest tokens filling cache.kv_budget; cuts within turns.
  group:
    variant: scope_tool_v30
    options: {}
  agentkv:
    options:
      eviction_interval: 128
      anchor_budget: 32
      observation_window: 8
      sink_tokens: 16
      pooling_kernel_size: 1
  dram_backed_kv:
    options:
      query_source: goal
      budget_mode: fixed  # User's 8K budget; ratio reproduces upstream budgeting.
      active_ratio: 0.40
      goal_rewriter_model: null  # Upstream CLI default; optional local small model.
      goal_rewriter_max_new_tokens: 384
      goal_rewriter_timeout: 120.0
      recent_turns: 2
      recent_quota: 64
      hidden_layer: -1
      projection_dimension: 128
      projection_seed: 42
